<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="8" y="8" width="104" height="104" rx="26" stroke="#818cf8" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Graduation Cap (Mortarboard) -->
  <g transform="translate(60, 48)">
    <!-- Cap Top Diamond -->
    <polygon points="0,-18 36,0 0,18 -36,0" fill="#ffffff" />
    <!-- Cap Underneath Skullcap -->
    <path d="M -22,4 L -22,14 C -22,23 22,23 22,14 L 22,4 C 15,10 -15,10 -22,4 Z" fill="#e0e7ff" />
    <!-- Tassel Button & Cord -->
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)" />
    <path d="M 0,0 C 14,-2 26,10 27,24" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polygon points="25,24 29,24 30,32 24,32" fill="url(#goldGrad)" />
  </g>

  <!-- Open Book Symbol -->
  <g transform="translate(60, 82)">
    <!-- Book Left Page -->
    <path d="M -3,6 C -12,2 -24,2 -30,4 C -31,4 -32,5 -32,6 L -32,22 C -32,23 -31,24 -30,24 C -24,22 -12,22 -3,26 Z" fill="#ffffff" />
    <!-- Book Right Page -->
    <path d="M 3,6 C 12,2 24,2 30,4 C 31,4 32,5 32,6 L 32,22 C 32,23 31,24 30,24 C 24,22 12,22 3,26 Z" fill="#ffffff" />
    <!-- Center spine divider -->
    <line x1="0" y1="6" x2="0" y2="26" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>